# Agent adapter configuration.
# The MVP should implement only the manual adapter.

schema_version: 1

schema:
  required_top_level:
    - default_adapter
    - adapters
    - policy
  adapter_entry_required:
    - type
    - enabled
  policy_required:
    - adapter_required_for_doctor
    - default_mvp_adapter
    - agent_specific_logic_allowed_in_core
  validation_rules:
    - default_adapter key must exist in adapters
    - default_adapter entry must have enabled: true

default_adapter: manual

adapters:
  manual:
    enabled: true
    type: manual
    description: "Generate prompts or artifacts; user manually passes them to any agent and saves outputs."

  codex_cli:
    enabled: false
    type: external_agent
    description: "Future adapter for Codex CLI."

  cline:
    enabled: false
    type: external_agent
    description: "Future adapter for Cline. Plan or Act should be adapter-level behavior."

  roo:
    enabled: false
    type: external_agent
    description: "Future adapter for Roo."

  continue:
    enabled: false
    type: external_agent
    description: "Future adapter for Continue."

  aider:
    enabled: false
    type: external_agent
    description: "Future adapter for Aider."

  internal:
    enabled: false
    type: internal_agent
    description: "Future restricted internal agent. Not part of MVP."

policy:
  adapter_required_for_doctor: false
  default_mvp_adapter: manual
  agent_specific_logic_allowed_in_core: false
